apiVersion: apps/v1
kind: Deployment
metadata:
  name: custom-profile-service
  labels:
    app: custom-profile-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-profile-service
  template:
    metadata:
      labels:
        app: custom-profile-service
    spec:
      containers:
        - name: api
          image: custom-profile-service:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: custom-profile-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
